
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<title>Mayaira AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:#080d1b;
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 justify-content:center;
 padding:15px;
}
.app{
 width:100%;
 max-width:450px;
 background:#111a30;
 border:1px solid #24518b;
 border-radius:24px;
 padding:20px;
 box-shadow:0 0 30px #078cff33;
}
.logo{
 width:75px;height:75px;
 margin:5px auto;
 display:grid;place-items:center;
 border:2px solid #27baff;
 border-radius:50%;
 color:#40c8ff;
 font-size:38px;
 box-shadow:0 0 25px #168bff;
}
h1{text-align:center;color:#45c5ff}
.sub{text-align:center;color:#a9bddc}
select,input{
 width:100%;
 padding:14px;
 margin-top:12px;
 border-radius:12px;
 border:1px solid #31547e;
 background:#091326;
 color:white;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:12px;
 background:#078cff;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:active{opacity:.7}
.secondary{background:#17365b}
#answer{
 margin-top:18px;
 padding:16px;
 min-height:100px;
 background:#091326;
 border-radius:12px;
 white-space:pre-wrap;
 line-height:1.6;
 overflow-wrap:anywhere;
}
.footer{text-align:center;color:#8ba6ca;font-size:12px}
</style>
</head>

<body>
<div class="app">

<div class="logo">✦</div>
<h1>Mayaira AI</h1>
<p class="sub">Your Personal AI Assistant</p>
<p class="sub"><b>Hello Boss! ❤️</b></p>

<select id="language">
<option value="hi-IN">हिंदी</option>
<option value="ne-NP">नेपाली</option>
<option value="en-US">English</option>
</select>

<select id="voice">
<option value="female">Female Voice</option>
<option value="male">Male Voice</option>
</select>

<input id="question"
placeholder="Ask Mayaira anything..."
autocomplete="off">

<button onclick="sendMessage()">💬 Send Message</button>
<button class="secondary" onclick="listen()">🎤 Voice Input</button>
<button class="secondary" onclick="speak()">🔊 Speak Answer</button>
<button class="secondary" onclick="searchWeb()">🌐 Search Internet</button>

<div id="answer">
Hello Boss! Mayaira AI is ready. ❤️
</div>

<p class="footer">Mayaira AI • Smart Assistant</p>
</div>

<script>
const $ = id => document.getElementById(id);

function sendMessage(){
 const q=$("question").value.trim();
 const lang=$("language").value;

 if(!q){
  alert("Please type your question");
  return;
 }

 let reply="";

 if(lang==="hi-IN"){
  reply="आपने पूछा: "+q+
  "\n\nनमस्ते Boss! ❤️ आपका Mayaira AI तैयार है। असली AI सर्वर कनेक्शन जोड़ना बाकी है।";
 }
 else if(lang==="ne-NP"){
  reply="तपाईंले सोध्नुभयो: "+q+
  "\n\nनमस्ते Boss! ❤️ Mayaira AI तयार छ। वास्तविक AI सर्भर जडान गर्न बाँकी छ।";
 }
 else{
  reply="You asked: "+q+
  "\n\nHello Boss! ❤️ Mayaira AI is ready. Real AI server connection is still pending.";
 }

 $("answer").innerText=reply;
}

function speak(){
 if(!window.speechSynthesis){
  alert("Speech is not supported in this browser");
  return;
 }

 const msg=new SpeechSynthesisUtterance(
  $("answer").innerText
 );

 msg.lang=$("language").value;

 const voices=window.speechSynthesis.getVoices();
 const lang=msg.lang.split("-")[0];

 const matching=voices.filter(v=>
  v.lang.toLowerCase().startsWith(lang.toLowerCase())
 );

 if(matching.length){
  const selected=$("voice").value;
  const preferred=matching.find(v=>
   selected==="female"
   ? /female|woman|zira|samantha/i.test(v.name)
   : /male|man|david|daniel/i.test(v.name)
  );
  msg.voice=preferred||matching[0];
 }

 speechSynthesis.cancel();
 speechSynthesis.speak(msg);
}

function listen(){
 const SR=window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!SR){
  alert("Please use Google Chrome for voice input");
  return;
 }

 const rec=new SR();
 rec.lang=$("language").value;
 rec.onresult=e=>{
  $("question").value=e.results[0][0].transcript;
 };
 rec.onerror=()=>{
  alert("Microphone error. Check permission.");
 };
 rec.start();
}

function searchWeb(){
 const q=$("question").value.trim();

 if(!q){
  alert("Please type something first");
  return;
 }

 window.open(
  "https://www.google.com/search?q="+
  encodeURIComponent(q),
  "_blank"
 );
}
</script>
</body>
</html>
