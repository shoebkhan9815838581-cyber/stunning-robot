
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>Mayaira AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#10152b,#202b50);
 color:white;
 min-height:100vh;
 padding:18px;
}
.container{
 max-width:600px;
 margin:20px auto;
 background:#19213d;
 padding:22px;
 border-radius:20px;
 box-shadow:0 8px 30px #0006;
}
h1{text-align:center;color:#65e5ff}
.sub{text-align:center;color:#bbb}
label{display:block;margin-top:18px;margin-bottom:7px}
select,input,textarea{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 font-size:16px;
 background:#fff;
 color:#111;
}
textarea{resize:vertical;min-height:90px}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:10px;
 background:#19b9dc;
 color:#06121c;
 font-size:16px;
 font-weight:bold;
}
button:active{opacity:.7}
#answer{
 margin-top:20px;
 padding:16px;
 background:#10182e;
 border-radius:12px;
 min-height:100px;
 white-space:pre-wrap;
 line-height:1.6;
 overflow-wrap:anywhere;
}
.footer{text-align:center;color:#aaa;font-size:12px;margin-top:20px}
</style>
</head>

<body>
<div class="container">

<h1>🤖 Mayaira AI</h1>
<p class="sub">Your Smart AI Assistant ❤️</p>

<label>🌐 Select Language</label>
<select id="language">
<option value="hi-IN">Hindi</option>
<option value="ne-NP">Nepali</option>
<option value="en-US">English</option>
</select>

<label>🎙️ Select Voice</label>
<select id="voice">
<option value="female">Female Voice</option>
<option value="male">Male Voice</option>
</select>

<label>💬 Ask Mayaira AI</label>
<textarea id="question" placeholder="अपना सवाल यहाँ लिखें..."></textarea>

<button onclick="sendMessage()">🚀 Send Message</button>
<button onclick="listen()">🎤 Speak Question</button>
<button onclick="speak()">🔊 Speak Answer</button>

<div id="answer">नमस्ते! ❤️ मैं Mayaira AI हूँ। मुझसे कुछ भी पूछिए।</div>

<p class="footer">Mayaira AI ❤️ Made with love</p>
</div>

<script>
const $ = id => document.getElementById(id);

async function sendMessage(){
 const q=$("question").value.trim();
 const lang=$("language").value;

 if(!q){
  alert("Please type your question");
  return;
 }

 let instruction="Reply in English.";
 if(lang==="hi-IN") instruction="Reply in Hindi.";
 if(lang==="ne-NP") instruction="Reply in Nepali.";

 $("answer").innerText="Mayaira AI is thinking... ❤️";

 try{
  const response=await fetch(
   "https://script.google.com/macros/s/AKfycbxugy9Ub8cM942-w63Wc-vNzg7qhjtmtBdFxWLqb8FFbGIqzrzYgyi_ifbV-RkUbPUo/exec",
   {
    method:"POST",
    headers:{
     "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify({
     question:instruction+"\n\n"+q
    })
   }
  );

  const data=await response.json();

  if(data.error){
   throw new Error(data.error);
  }

  $("answer").innerText=data.answer || "No answer received.";

 }catch(error){
  $("answer").innerText="Connection error: "+error.message;
 }
}

function speak(){
 const text=$("answer").innerText;
 if(!text) return;

 speechSynthesis.cancel();

 const msg=new SpeechSynthesisUtterance(text);
 msg.lang=$("language").value;

 const voices=speechSynthesis.getVoices();
 const selected=$("voice").value;

 let matching=voices.filter(v=>{
  return v.lang.toLowerCase().startsWith(
   msg.lang.substring(0,2).toLowerCase()
  );
 });

 if(matching.length){
  msg.voice=selected==="female"
   ? matching.find(v=>/female|woman|zira|samantha/i.test(v.name)) || matching[0]
   : matching.find(v=>/male|man|david|mark/i.test(v.name)) || matching[0];
 }

 speechSynthesis.speak(msg);
}

function listen(){
 const SpeechRecognition=
  window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  alert("Voice input is not supported in this browser.");
  return;
 }

 const recognition=new SpeechRecognition();
 recognition.lang=$("language").value;
 recognition.interimResults=false;

 recognition.onresult=function(event){
  $("question").value=event.results[0][0].transcript;
 };

 recognition.onerror=function(){
  alert("Microphone error. Please try again.");
 };

 recognition.start();
}

speechSynthesis.onvoiceschanged=function(){};
</script>
</body>
</html>
